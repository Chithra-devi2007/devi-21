
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chithuzz</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Poppins', sans-serif;
    overflow: hidden;
    background:
        radial-gradient(circle at 15% 20%, #fff0f7, transparent 35%),
        radial-gradient(circle at 85% 80%, #e5d5ff, transparent 40%),
        linear-gradient(135deg, #f9d9eb, #d9c5ff);
}

/* Floating hearts */
.heart {
    position: absolute;
    color: rgba(255,255,255,0.7);
    font-size: 25px;
    animation: float 8s linear infinite;
    pointer-events: none;
}

@keyframes float {
    0% {
        transform: translateY(110vh) rotate(0deg);
        opacity: 0;
    }
    20% { opacity: 1; }
    100% {
        transform: translateY(-15vh) rotate(360deg);
        opacity: 0;
    }
}

/* Login box */
.login-box {
    width: 340px;
    padding: 35px 28px;
    text-align: center;
    border-radius: 28px;
    background: rgba(255,255,255,0.48);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.8);
    box-shadow: 0 15px 45px rgba(151, 91, 160, 0.2);
    z-index: 2;
}

h2 {
    color: #a34e91;
    font-size: 29px;
    letter-spacing: 3px;
    margin-bottom: 25px;
}

.username {
    width: 100%;
    padding: 13px;
    border: 1px solid #e7b9d9;
    outline: none;
    border-radius: 12px;
    background: rgba(255,255,255,0.75);
    text-align: center;
    font-size: 15px;
    margin-bottom: 22px;
}

.dots {
    display: flex;
    justify-content: center;
    gap: 13px;
    margin-bottom: 25px;
}

.dot {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    border: 2px solid #bd83b6;
    background: transparent;
}

.dot.active {
    background: #bd83b6;
    box-shadow: 0 0 10px #d58bc8;
}

.keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

.key {
    height: 48px;
    border: none;
    border-radius: 14px;
    background: rgba(255,255,255,0.8);
    color: #98568f;
    font-size: 19px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(150,90,150,0.12);
    transition: 0.2s;
}

.key:active {
    transform: scale(0.92);
    background: #edc7e7;
}

.actions {
    display: flex;
    gap: 12px;
    margin-top: 18px;
}

.actions button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #d98bc7, #a88be8);
    color: white;
    font-size: 14px;
    cursor: pointer;
}

.error {
    color: #c04e82;
    font-size: 12px;
    margin-top: 14px;
    min-height: 17px;
}

@media(max-width: 400px) {
    .login-box {
        width: 90%;
        padding: 30px 22px;
    }
}
</style>
</head>

<body>

<div class="login-box">

    <h2>CHITHUZZ</h2>

    <input
        type="text"
        class="username"
        id="username"
        placeholder="Username"
    >

    <div class="dots" id="dots">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
    </div>

    <div class="keypad">
        <button class="key" onclick="addNumber('1')">1</button>
        <button class="key" onclick="addNumber('2')">2</button>
        <button class="key" onclick="addNumber('3')">3</button>
        <button class="key" onclick="addNumber('4')">4</button>
        <button class="key" onclick="addNumber('5')">5</button>
        <button class="key" onclick="addNumber('6')">6</button>
        <button class="key" onclick="addNumber('7')">7</button>
        <button class="key" onclick="addNumber('8')">8</button>
        <button class="key" onclick="addNumber('9')">9</button>
        <button class="key" onclick="clearPassword()">C</button>
        <button class="key" onclick="addNumber('0')">0</button>
        <button class="key" onclick="deleteNumber()">⌫</button>
    </div>

    <div class="actions">
        <button onclick="clearPassword()">CLEAR</button>
        <button onclick="login()">ENTER</button>
    </div>

    <p class="error" id="error"></p>

</div>

<script>
let password = "";

function addNumber(number) {
    if (password.length < 8) {
        password += number;
        updateDots();
    }
}

function clearPassword() {
    password = "";
    updateDots();
    document.getElementById("error").textContent = "";
}

function deleteNumber() {
    password = password.slice(0, -1);
    updateDots();
}

function updateDots() {
    const dots = document.querySelectorAll(".dot");

    dots.forEach((dot, index) => {
        dot.classList.toggle("active", index < password.length);
    });
}

function login() {
    const username = document.getElementById("username").value.trim();
    const error = document.getElementById("error");

    if (username === "") {
        error.textContent = "Enter username";
        return;
    }

    if (password === "21042007") {
        error.textContent = "";
        alert("Login successful!");
    } else {
        error.textContent = "Incorrect password";
        clearPassword();
    }
}

/* Floating hearts */
for (let i = 0; i < 18; i++) {
    let heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "♥";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDelay = Math.random() * 8 + "s";
    heart.style.animationDuration = (6 + Math.random() * 8) + "s";
    document.body.appendChild(heart);
}
</script>

</body>
</html>
