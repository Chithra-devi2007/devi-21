
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chithuzz Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(-45deg,
        #ffd6ec, #e8cfff, #f7d5ff, #d9c4ff, #ffe0ef);
    background-size: 400% 400%;
    animation: gradient 12s ease infinite;
}

@keyframes gradient {
    0% {background-position: 0% 50%}
    50% {background-position: 100% 50%}
    100% {background-position: 0% 50%}
}

/* Animated background glow */
.glow {
    position: fixed;
    width: 280px;
    height: 280px;
    border-radius: 50%;
    filter: blur(75px);
    opacity: .5;
    animation: glowMove 9s ease-in-out infinite alternate;
}

.glow.one {
    background: #ff83c8;
    top: -80px;
    left: -70px;
}

.glow.two {
    background: #a68aff;
    bottom: -90px;
    right: -70px;
    animation-delay: 3s;
}

@keyframes glowMove {
    to { transform: translate(100px, 80px) scale(1.4); }
}

/* Floating decorations */
.particle {
    position: fixed;
    pointer-events: none;
    z-index: 1;
    animation: floatUp linear infinite;
    opacity: 0;
    user-select: none;
}

@keyframes floatUp {
    0% {
        transform: translateY(110vh) rotate(0deg) scale(.5);
        opacity: 0;
    }
    15% {opacity: .8;}
    80% {opacity: .7;}
    100% {
        transform: translateY(-15vh) rotate(360deg) scale(1.2);
        opacity: 0;
    }
}

/* Twinkling stars */
.star {
    position: fixed;
    color: white;
    animation: twinkle 2s ease-in-out infinite alternate;
    pointer-events: none;
}

@keyframes twinkle {
    from {opacity: .15; transform: scale(.5);}
    to {opacity: 1; transform: scale(1.5);}
}

/* Butterfly animation */
.butterfly {
    position: fixed;
    font-size: 30px;
    animation: butterflyMove 12s ease-in-out infinite;
    pointer-events: none;
}

@keyframes butterflyMove {
    0% {transform: translate(-10vw, 20vh) rotate(-15deg);}
    25% {transform: translate(30vw, 5vh) rotate(15deg);}
    50% {transform: translate(60vw, 35vh) rotate(-15deg);}
    75% {transform: translate(20vw, 55vh) rotate(15deg);}
    100% {transform: translate(-10vw, 20vh) rotate(-15deg);}
}

/* Login card */
.login-box {
    position: relative;
    z-index: 5;
    width: 350px;
    padding: 38px 28px;
    border-radius: 30px;
    text-align: center;
    background: rgba(255,255,255,.35);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    border: 1px solid rgba(255,255,255,.8);
    box-shadow:
        0 20px 60px rgba(135,75,160,.2),
        inset 0 0 25px rgba(255,255,255,.4);
    animation: cardEnter 1.2s cubic-bezier(.2,.8,.2,1) both,
               cardFloat 5s ease-in-out 1.2s infinite;
}

@keyframes cardEnter {
    from {
        opacity: 0;
        transform: translateY(60px) scale(.8);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes cardFloat {
    0%,100% {margin-top: 0;}
    50% {margin-top: -9px;}
}

/* Animated border */
.login-box::before {
    content: "";
    position: absolute;
    inset: -2px;
    border-radius: 32px;
    padding: 2px;
    background: linear-gradient(120deg,
        #fff, #f18dcc, #b99aff, #fff, #f18dcc);
    background-size: 300% 300%;
    animation: borderGlow 5s linear infinite;
    z-index: -1;
}

@keyframes borderGlow {
    0% {background-position: 0% 50%;}
    100% {background-position: 300% 50%;}
}

h1 {
    color: #a34d91;
    font-size: 29px;
    letter-spacing: 5px;
    margin-bottom: 30px;
    text-shadow: 0 0 15px #fff;
    animation: titleGlow 3s ease-in-out infinite alternate;
}

@keyframes titleGlow {
    from {text-shadow: 0 0 5px #fff;}
    to {text-shadow: 0 0 18px #f58dd0, 0 0 30px #c9a5ff;}
}

.username {
    width: 100%;
    padding: 14px;
    border: 1px solid #e7b9d9;
    outline: none;
    border-radius: 14px;
    background: rgba(255,255,255,.7);
    text-align: center;
    font-size: 15px;
    color: #99518e;
    margin-bottom: 25px;
    transition: .3s;
}

.username:focus {
    border-color: #bd83d9;
    box-shadow: 0 0 18px #e7a8dc;
    transform: scale(1.03);
}

/* Password dots */
.dots {
    display: flex;
    justify-content: center;
    gap: 13px;
    margin-bottom: 27px;
}

.dot {
    width: 13px;
    height: 13px;
    border: 2px solid #b57ab6;
    border-radius: 50%;
    transition: .3s;
}

.dot.active {
    background: #d875bd;
    border-color: #d875bd;
    box-shadow: 0 0 12px #ed8ed5;
    transform: scale(1.25);
    animation: dotPop .3s ease;
}

@keyframes dotPop {
    50% {transform: scale(1.6);}
}

/* Keypad */
.keypad {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 12px;
}

.key {
    height: 49px;
    border: 1px solid rgba(255,255,255,.8);
    border-radius: 15px;
    background: rgba(255,255,255,.7);
    color: #98568f;
    font-size: 19px;
    cursor: pointer;
    box-shadow: 0 5px 12px rgba(150,90,150,.1);
    transition: .25s;
}

.key:hover {
    background: #f7d4ed;
    transform: translateY(-5px) scale(1.06);
    box-shadow: 0 7px 20px #e5a9dc;
}

.key:active {
    transform: scale(.88);
}

/* Action buttons */
.actions {
    display: flex;
    gap: 12px;
    margin-top: 20px;
}

.actions button {
    flex: 1;
    padding: 13px;
    border: none;
    border-radius: 13px;
    background: linear-gradient(120deg,#e88bc7,#a78be8);
    background-size: 200% 200%;
    color: white;
    font-weight: bold;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow: 0 5px 15px #d5a0df;
    transition: .3s;
    animation: buttonGlow 3s ease infinite;
}

@keyframes buttonGlow {
    50% {box-shadow: 0 5px 25px #e98bcf;}
}

.actions button:hover {
    transform: translateY(-4px);
    background-position: right;
}

.actions button:active {
    transform: scale(.94);
}

.error {
    color: #bd427c;
    font-size: 12px;
    margin-top: 14px;
    min-height: 16px;
}

/* Mobile */
@media(max-width: 400px) {
    .login-box {
        width: 90%;
        padding: 32px 22px;
    }
    h1 {font-size: 25px;}
}
</style>
</head>

<body>

<div class="glow one"></div>
<div class="glow two"></div>

<div class="login-box">
    <h1>CHITHUZZ</h1>

    <input
        type="text"
        id="username"
        class="username"
        placeholder="Username"
        autocomplete="off"
    >

    <div class="dots">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
    </div>

    <div class="keypad">
        <button class="key" onclick="addNumber('1')">1</button>
        <button class="key" onclick="addNumber('2')">2</button>
        <button class="key" onclick="addNumber('3')">3</button>
        <button class="key" onclick="addNumber('4')">4</button>
        <button class="key" onclick="addNumber('5')">5</button>
        <button class="key" onclick="addNumber('6')">6</button>
        <button class="key" onclick="addNumber('7')">7</button>
        <button class="key" onclick="addNumber('8')">8</button>
        <button class="key" onclick="addNumber('9')">9</button>
        <button class="key" onclick="clearPassword()">C</button>
        <button class="key" onclick="addNumber('0')">0</button>
        <button class="key" onclick="deleteNumber()">⌫</button>
    </div>

    <div class="actions">
        <button onclick="clearPassword()">CLEAR</button>
        <button onclick="login()">ENTER</button>
    </div>

    <p class="error" id="error"></p>
</div>

<script>
let password = "";

function addNumber(number) {
    if (password.length < 8) {
        password += number;
        updateDots();
    }
}

function clearPassword() {
    password = "";
    updateDots();
    document.getElementById("error").textContent = "";
}

function deleteNumber() {
    password = password.slice(0, -1);
    updateDots();
}

function updateDots() {
    document.querySelectorAll(".dot").forEach((dot,index) => {
        dot.classList.toggle("active", index < password.length);
    });
}

function login() {
    const username = document.getElementById("username").value.trim();
    const error = document.getElementById("error");

    if (!username) {
        error.textContent = "Enter username";
        return;
    }

    if (password === "21042007") {
        error.style.color = "#8c4bb0";
        error.textContent = "Login successful!";
    } else {
        error.textContent = "Incorrect password";
        clearPassword();
    }
}

/* Create floating hearts, petals and sparkles */
const decorations = ["♥", "♡", "✦", "✧", "🌸", "✨", "💜", "❀"];

for (let i = 0; i < 45; i++) {
    const item = document.createElement("div");
    item.className = "particle";
    item.textContent = decorations[
        Math.floor(Math.random() * decorations.length)
    ];

    item.style.left = Math.random() * 100 + "vw";
    item.style.fontSize = (12 + Math.random() * 23) + "px";
    item.style.animationDuration = (7 + Math.random() * 12) + "s";
    item.style.animationDelay = (Math.random() * 12) + "s";

    document.body.appendChild(item);
}

/* Twinkling stars */
for (let i = 0; i < 30; i++) {
    const star = document.createElement("div");
    star.className = "star";
    star.textContent = "✦";
    star.style.left = Math.random() * 100 + "vw";
    star.style.top = Math.random() * 100 + "vh";
    star.style.fontSize = (8 + Math.random() * 13) + "px";
    star.style.animationDelay = Math.random() * 3 + "s";

    document.body.appendChild(star);
}

/* Floating butterflies */
for (let i = 0; i < 3; i++) {
    const butterfly = document.createElement("div");
    butterfly.className = "butterfly";
    butterfly.textContent = "🦋";
    butterfly.style.top = (10 + Math.random() * 70) + "vh";
    butterfly.style.left = Math.random() * 70 + "vw";
    butterfly.style.animationDelay = (i * 3) + "s";

    document.body.appendChild(butterfly);
}
</script>

</body>
</html>
